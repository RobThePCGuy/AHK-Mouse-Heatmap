name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build heatmap generator EXE
        run: |
          pyinstaller --onefile --name generate_heatmap generate_heatmap.py

      - name: Download AutoHotkey v1 compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build | Out-Null
          $zipPath = "build\AutoHotkey_1.1.37.02.zip"
          Invoke-WebRequest "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip" -OutFile $zipPath
          Expand-Archive $zipPath -DestinationPath "build\AutoHotkey" -Force

      - name: Locate AutoHotkey compiler files
        id: ahk2exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = Get-ChildItem "build\AutoHotkey" -Recurse -Filter Ahk2Exe.exe | Select-Object -First 1 -ExpandProperty FullName
          $runtime = Get-ChildItem "build\AutoHotkey" -Recurse -Filter AutoHotkeyU64.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compiler) {
            Get-ChildItem "build\AutoHotkey" -Recurse | Select-Object FullName
            throw "Compiler was not found in the AutoHotkey ZIP."
          }
          if (-not $runtime) {
            Get-ChildItem "build\AutoHotkey" -Recurse | Select-Object FullName
            throw "Runtime was not found in the AutoHotkey ZIP."
          }
          "path=$compiler" >> $env:GITHUB_OUTPUT
          "runtime=$runtime" >> $env:GITHUB_OUTPUT

      - name: Build AutoHotkey app EXE
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          $ahk2exe = "${{ steps.ahk2exe.outputs.path }}"
          $runtimePath = "${{ steps.ahk2exe.outputs.runtime }}"
          $inputPath = (Resolve-Path "heatmap.ahk").Path
          $outputPath = Join-Path (Resolve-Path "dist").Path "AHK-Mouse-Heatmap.exe"
          $iconPath = (Resolve-Path "AHK-Mouse-Heatmap.ico").Path
          $arguments = @("/in", $inputPath, "/out", $outputPath, "/icon", $iconPath, "/base", $runtimePath, "/mpress", "0")
          & $ahk2exe @arguments

          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $outputPath)) {
            Start-Sleep -Seconds 1
          }

          if (-not (Test-Path $outputPath)) {
            Get-ChildItem -Recurse dist,build\AutoHotkey | Select-Object FullName
            throw "AHK-Mouse-Heatmap.exe was not created."
          }

      - name: Assemble release package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\AHK-Mouse-Heatmap.exe package\AHK-Mouse-Heatmap.exe
          Copy-Item dist\generate_heatmap.exe package\generate_heatmap.exe
          Copy-Item AHK-Mouse-Heatmap.ico package\AHK-Mouse-Heatmap.ico
          Copy-Item README.md package\README.md
          Copy-Item LICENSE* package\ -ErrorAction SilentlyContinue
          Compress-Archive -Path package\* -DestinationPath AHK-Mouse-Heatmap-Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AHK-Mouse-Heatmap-Windows
          path: AHK-Mouse-Heatmap-Windows.zip

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AHK-Mouse-Heatmap-Windows.zip
